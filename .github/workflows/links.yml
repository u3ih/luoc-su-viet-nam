name: Kiểm tra link nguồn
on:
  schedule:
    - cron: "0 2 * * 1" # thứ Hai hằng tuần, 9 giờ sáng giờ Việt Nam
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-links.mjs
